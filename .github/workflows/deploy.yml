# GitHub Pages: https://ohmwork.linjiejim.com
# Pull requests run the checks only; a push to main also deploys.
# Custom domain, DNS and HTTPS are set once on the repo (see README → 部署).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # the build writes one HTML file per page plus 404.html and sitemap.xml (vite.config.ts → sitePages)
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      # without them every deep link is a bare 404: fail here, not in production
      - run: test -f dist/404.html && test -f dist/learn/basics/ohms-law.html && test -f dist/learn/basics/index.html && test -f dist/sitemap.xml
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
