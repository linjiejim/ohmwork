# Ohmwork 云同步后端（Cloudflare Worker + D1）
# 1. 创建 D1 数据库：npx wrangler d1 create ohmwork
#    把返回的 database_id 填到下面 [[d1_databases]] 里。
# 2. 执行数据库建表迁移：npx wrangler d1 migrations apply ohmwork --remote
# 3. 配置 GitHub OAuth 密钥（可选，不配则仅开启用户名密码登录）：
#    npx wrangler secret put GITHUB_CLIENT_ID
#    npx wrangler secret put GITHUB_CLIENT_SECRET
# 4. 部署：npx wrangler deploy
# 5. 在 GitHub 仓库 Settings → Variables → Actions 里新增 VITE_API_BASE，
#    填上 Worker 地址（如 https://api.ohmwork.linjiejim.com）。

name = "ohmwork-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://ohmwork.linjiejim.com,http://localhost:5273,http://127.0.0.1:5273"
# 如绑定了自定义域名，取消注释并改成你的 API 域名（用于拼接 GitHub OAuth 回调地址）
# PUBLIC_BASE_URL = "https://api.ohmwork.linjiejim.com"

[[d1_databases]]
binding = "DB"
database_name = "ohmwork"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
